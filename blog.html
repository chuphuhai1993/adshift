<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Category- ADShift</title>
    <link href="./src/style.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen flex flex-col font-['Space_Grotesk']">
    <div id="header-placeholder"></div>
 
    <main>
        <!-- Hero Section -->
        <section class="relative gradient-secondary overflow-hidden pt-32 pb-20">
            <div class="container mx-auto px-4 relative z-10">
                <nav class="flex text-sm text-gray-500 mb-6">
                    <a href="./" class="hover:text-blue-600">Home</a>
                    <span class="mx-2">›</span>
                    <span class="text-gray-900 font-medium">Blog</span>
                </nav>
                
                <div class="max-w-2xl">
                    <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-4">Google Ads</h1>
                    <p class="text-gray-600 leading-relaxed text-lg">
                        Explore expert tips, how-tos, and strategies for running successful Google Ads campaigns. 
                        Learn everything from setup to optimization, account management, and agency-level solutions.
                    </p>
                </div>
            </div>
            
            <!-- Decorative Image -->
            <div class="absolute top-0 right-0 h-full w-1/2 md:w-1/3 lg:w-1/4 pointer-events-none">
                 <img src="assets/ADShift_decorative.png" class="object-cover w-full h-full opacity-80" alt="Decoration">
            </div>
        </section>

        <!-- Google Ads -->
        <section class="py-20">
            <div class="container mx-auto px-4">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Google Ads</h2>
                <div id="post-list-blog-google" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
                <div class="flex justify-center mt-8">
                    <button class="btn btn-secondary btn-md px-6">View More</button>
                </div>
            </div>
        </section>

        <!-- Meta Ads -->
        <section class="py-6 md:py-16">
            <div class="container mx-auto px-4">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Meta Ads</h2>
                <div id="post-list-blog-meta" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
                <div class="flex justify-center mt-8">
                    <button class="btn btn-secondary btn-md px-6">View More</button>
                </div>
            </div>
        </section>

        <!-- TIKTOK Ads -->
        <section class="py-6 md:py-16">
            <div class="container mx-auto px-4">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">TIKTOK Ads</h2>
                <div id="post-list-blog-tiktok" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
                <div class="flex justify-center mt-8">
                    <button class="btn btn-secondary btn-md px-6">View More</button>
                </div>
            </div>
        </section>

        <!-- Bing Ads -->
        <section class="py-6 md:py-16">
            <div class="container mx-auto px-4">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">Bing Ads</h2>
                <div id="post-list-blog-bing" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
                <div class="flex justify-center mt-8">
                    <button class="btn btn-secondary btn-md px-6">View More</button>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>

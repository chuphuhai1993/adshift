<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance - ADShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="./src/style.css" rel="stylesheet">
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white min-h-screen flex flex-col font-['Space_Grotesk']">
    <div id="header-placeholder"></div>

    <main class="flex-grow relative flex items-center justify-center min-h-[80vh] overflow-hidden">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img src="assets/bg_404.jpg" alt="Background" class="w-full h-full object-cover">
        </div>

        <!-- Content -->
        <div class="relative z-10 w-full max-w-[800px] mx-auto px-4 flex flex-col items-center text-center">
            
            <!-- Maintenance Icon -->
            <div class="mb-6">
                <img src="assets/payment_done.png" alt="Maintenance Icon" class="w-32 h-32 md:w-32 md:h-32"> 
            </div>

            <!-- Heading -->
            <h1 class="text-3xl md:text-5xl font-bold text-gray-900 mb-6">
                Thanh toán thành công
            </h1>

            <!-- Subtext -->
            <p class="text-gray-500 text-md mb-8">
                It is a long established fact that a reader will be distracted by the readable content of a page when looking at its layout. The point of using Lorem Ipsum is that it has a more-or-less normal distribution of letters.
            </p>

        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="src/main.js"></script>
    <script src="https://cdn.tailwindcss.com"></script> 
</body>
</html>

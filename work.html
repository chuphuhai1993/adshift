<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work - Dự án HTML Tailwind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="header-placeholder"></div>

    <main class="container mx-auto p-4 flex-grow">
        <div class="bg-white p-8 rounded-lg shadow-lg mt-8">
            <h1 class="text-3xl font-bold mb-6 text-gray-800">Our Work</h1>
            <p class="text-gray-600 mb-8">Check out some of our recent projects.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">
                    <div class="h-48 bg-gray-200 flex items-center justify-center">
                        <span class="text-gray-400 font-bold text-xl">Project Image</span>
                    </div>
                    <div class="p-6">
                        <h3 class="font-bold text-xl mb-2">E-commerce Platform</h3>
                        <p class="text-gray-600 mb-4">A full-featured online store built with modern technologies.</p>
                        <button class="btn btn-secondary btn-sm">View Case Study</button>
                    </div>
                </div>
                
                <div class="border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition">
                    <div class="h-48 bg-gray-200 flex items-center justify-center">
                        <span class="text-gray-400 font-bold text-xl">Project Image</span>
                    </div>
                    <div class="p-6">
                        <h3 class="font-bold text-xl mb-2">Corporate Website</h3>
                        <p class="text-gray-600 mb-4">A professional website for a leading financial firm.</p>
                        <button class="btn btn-secondary btn-sm">View Case Study</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>

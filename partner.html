<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner - Dự án HTML Tailwind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="header-placeholder"></div>

    <main class="container mx-auto p-4 flex-grow">
        <div class="bg-white p-8 rounded-lg shadow-lg mt-8">
            <h1 class="text-3xl font-bold mb-6 text-gray-800">Our Partners</h1>
            <p class="text-gray-600 mb-8">We work with the best in the industry.</p>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
                <div class="p-8 border rounded-lg flex items-center justify-center grayscale hover:grayscale-0 transition duration-300">
                    <span class="font-bold text-xl text-blue-600">Partner 1</span>
                </div>
                <div class="p-8 border rounded-lg flex items-center justify-center grayscale hover:grayscale-0 transition duration-300">
                    <span class="font-bold text-xl text-green-600">Partner 2</span>
                </div>
                <div class="p-8 border rounded-lg flex items-center justify-center grayscale hover:grayscale-0 transition duration-300">
                    <span class="font-bold text-xl text-purple-600">Partner 3</span>
                </div>
                <div class="p-8 border rounded-lg flex items-center justify-center grayscale hover:grayscale-0 transition duration-300">
                    <span class="font-bold text-xl text-red-600">Partner 4</span>
                </div>
            </div>

            <div class="mt-12 text-center">
                <h2 class="text-2xl font-bold mb-4">Become a Partner</h2>
                <p class="text-gray-600 mb-6">Interested in collaborating with us?</p>
                <button class="btn btn-primary btn-lg">Apply Now</button>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - ADShift</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="./src/style.css" rel="stylesheet">
</head>
<body class="bg-white min-h-screen flex flex-col font-['Space_Grotesk']">
    <div id="simple-header-placeholder"></div>

    <main class="flex-grow relative flex items-center justify-center min-h-[100vh] py-32 overflow-hidden">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img src="assets/bg_404.jpg" alt="Background" class="w-full h-full object-cover">
        </div>

        <!-- Content -->
        <div class="relative z-10 w-full max-w-[1000px] mx-auto px-4 flex flex-col items-center">
            
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-8 text-center">Quý khách vui lòng thanh toán dịch vụ</h1>

            <div class="bg-white rounded-3xl p-8 md:p-10 shadow-xl w-full max-w-4xl mx-auto">
                <h2 class="text-xl font-bold text-gray-900 mb-6">Lựa chọn hình thức thanh toán</h2>
                
                <form class="space-y-4">
                    <!-- Name -->
                    <div>
                        <input type="text" placeholder="Your name" class="w-full flex-grow bg-gray-100 border border-gray-200 rounded-xl px-6 py-4 text-gray-700 text-sm placeholder-gray-500 focus:bg-white transition-all">
                    </div>

                    <!-- Email -->
                    <div>
                        <input type="email" placeholder="Your email" class="w-full flex-grow bg-gray-100 border border-gray-200 rounded-xl px-6 py-4 text-gray-700 text-sm placeholder-gray-500 focus:bg-white transition-all">
                    </div>

                    <!-- Phone -->
                    <div class="flex gap-4">
                        <div class="w-24 flex-shrink-0 bg-gray-100 rounded-xl px-4 py-4 flex items-center justify-center cursor-pointer">
                            <img src="https://flagcdn.com/w40/us.png" alt="US Flag" class="h-5 w-auto rounded-sm mr-2">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                        <input type="tel" placeholder="Your phone number" class="w-full flex-grow bg-gray-100 border border-gray-200 rounded-xl px-6 py-4 text-gray-700 text-sm placeholder-gray-500 focus:bg-white transition-all">
                    </div>

                    <!-- Contact Details -->
                    <div>
                        <input type="text" placeholder="Contact details" class="w-full flex-grow bg-gray-100 border border-gray-200 rounded-xl px-6 py-4 text-gray-700 text-sm placeholder-gray-500 focus:bg-white transition-all">
                    </div>

                    <!-- Message -->
                    <div>
                        <textarea rows="4" placeholder="Your message" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-6 py-4 text-gray-700 text-sm placeholder-gray-500 focus:bg-white transition-all resize-none"></textarea>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex justify-end mt-6">
                        <button type="submit" class="btn btn-primary">
                            Submit
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>
    <script type="module" src="src/main.js"></script>
    <script src="https://cdn.tailwindcss.com"></script> 
</body>
</html>
